<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10182b">
  <meta name="description" content="月光正好，祝你中秋快乐。一个轻盈温暖的中秋祝福小站。">
  <title>月亮今晚很圆 — 中秋快乐</title>
  <style>
    :root{color-scheme:dark;--night:#10182b;--night2:#18243a;--gold:#f3d89a;--cream:#fff5de;--muted:#b7bfd0;--orange:#f0a66f}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 34%,#29334a 0,#182238 37%,#10182b 76%);color:var(--cream);font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}.star{position:absolute;width:2px;height:2px;background:#fff2ce;border-radius:50%;opacity:.65;box-shadow:0 0 8px #fff0c2;animation:twinkle 3s ease-in-out infinite alternate}.cloud{position:absolute;width:230px;height:50px;border-radius:50%;background:#9c829044;filter:blur(20px)}.cloud.one{top:24%;left:-60px}.cloud.two{top:42%;right:-80px;width:290px;opacity:.6}.wrap{width:min(100% - 36px,980px);margin:auto}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}.brand{letter-spacing:.15em;color:var(--gold);font-size:12px}.nav a{color:inherit;text-decoration:none}.hero{text-align:center;padding:60px 0 54px;position:relative}.date{font-size:11px;letter-spacing:.28em;color:var(--gold);opacity:.88}.hero h1{font-family:"Songti SC","STSong",serif;font-weight:500;font-size:clamp(42px,8vw,76px);letter-spacing:.12em;margin:22px 0 12px;color:var(--cream)}.subtitle{color:var(--muted);font-size:15px;letter-spacing:.12em}.moon-wrap{height:300px;display:grid;place-items:center;position:relative;margin:0 auto 12px}.moon{height:212px;width:212px;border-radius:50%;background:radial-gradient(circle at 32% 27%,#fff8df 0,#f7e7bc 36%,#e6c988 72%,#caa969 100%);box-shadow:0 0 25px #f5dca355,0 0 90px #f3d99b38,0 0 180px #f3d99b19;position:relative;animation:float 5s ease-in-out infinite}.moon:before,.moon:after{content:"";position:absolute;border-radius:50%;background:#c5a96d20}.moon:before{width:34px;height:25px;left:45px;top:58px;transform:rotate(-25deg)}.moon:after{width:23px;height:18px;right:48px;bottom:55px}.moon-crater{position:absolute;width:14px;height:14px;border-radius:50%;background:#c3a66a22;top:116px;left:87px;box-shadow:38px -62px 0 -4px #c3a66a25,-61px 20px 0 -6px #c3a66a2c}.orbit{position:absolute;width:300px;height:300px;border:1px solid #f3d89a12;border-radius:50%}.orbit:after{content:"✦";position:absolute;color:var(--gold);font-size:14px;top:40px;right:42px}.rabbit{position:absolute;bottom:18px;right:calc(50% - 170px);font-size:38px;filter:drop-shadow(0 4px 10px #080d18)}.rabbit-label{position:absolute;bottom:31px;left:calc(50% + 110px);font-size:11px;color:#d9c999;letter-spacing:.12em}.actions{display:flex;justify-content:center;gap:12px;margin-top:28px}.button{border:1px solid #f3d89a80;background:#f3d89a;color:#222336;border-radius:999px;padding:13px 21px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s}.button:hover{transform:translateY(-2px);background:#ffe6ab}.button.ghost{color:var(--cream);background:transparent;border-color:#ffffff35}.button.ghost:hover{background:#ffffff0c}.section{padding:44px 0 56px;text-align:center}.section-title{font-family:"Songti SC","STSong",serif;font-size:25px;letter-spacing:.14em;color:var(--gold);font-weight:400}.section-desc{font-size:13px;color:var(--muted);margin:10px 0 25px}.wishes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:left}.wish{padding:21px 20px;border:1px solid #ffffff16;border-radius:14px;background:linear-gradient(135deg,#ffffff09,#ffffff03);min-height:126px}.wish .icon{font-size:18px}.wish h3{font-family:"Songti SC","STSong",serif;color:var(--cream);font-size:16px;font-weight:400;margin:11px 0 6px}.wish p{color:var(--muted);font-size:12px;line-height:1.75;margin:0}.wishbox{margin:25px auto 0;max-width:530px;min-height:86px;border:1px dashed #f3d89a48;border-radius:14px;padding:19px;background:#0d142425;color:var(--cream);font-family:"Songti SC","STSong",serif;font-size:17px;line-height:1.7}.wishbox small{display:block;font:11px "PingFang SC","Microsoft YaHei",sans-serif;color:var(--muted);margin-top:5px}.bottom{text-align:center;padding:25px 0 36px;color:#8e99ad;font-size:11px;letter-spacing:.08em}.lantern{position:fixed;top:100px;font-size:48px;opacity:.7;filter:drop-shadow(0 0 18px #ef8b4966);animation:sway 4s ease-in-out infinite;transform-origin:top center;pointer-events:none}.lantern.left{left:max(20px,calc((100vw - 980px)/2 - 30px))}.lantern.right{right:max(20px,calc((100vw - 980px)/2 - 30px));animation-delay:-1.8s}@keyframes twinkle{to{opacity:.18;transform:scale(.7)}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes sway{50%{transform:rotate(5deg)}}
.family{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left}.family-btn{min-height:122px;padding:19px;border:1px solid #ffffff20;border-radius:16px;color:var(--cream);background:#ffffff09;text-align:left;cursor:pointer;transition:transform .2s,border-color .2s;font:inherit}.family-btn:hover,.family-btn:focus-visible{transform:translateY(-3px);border-color:#f3d89a9c;outline:none}.family-btn .emoji{font-size:24px}.family-btn .role{display:block;color:var(--gold);font-size:10px;letter-spacing:.12em;margin-top:13px}.family-btn strong{display:block;font-family:"Songti SC","STSong",serif;font-size:16px;font-weight:400;margin-top:5px}.wishbox{transition:border-color .25s,background .25s}.wishbox.active{border-color:#f3d89a9c;background:#f3d89a0b}`n    @media(max-width:650px){.family{grid-template-columns:repeat(2,1fr);gap:9px}.family-btn{min-height:112px;padding:15px}.wrap{width:calc(100% - 32px)}.nav{height:60px}.hero{padding:50px 0 38px}.hero h1{letter-spacing:.08em}.subtitle{font-size:13px}.moon-wrap{height:258px}.moon{width:178px;height:178px}.moon-crater{top:98px;left:74px}.orbit{width:255px;height:255px}.rabbit{right:calc(50% - 144px);bottom:7px;font-size:31px}.rabbit-label{left:calc(50% + 86px);bottom:21px;font-size:9px}.wishes{grid-template-columns:1fr;gap:9px}.wish{min-height:0;padding:17px 18px;display:grid;grid-template-columns:28px 1fr;column-gap:7px}.wish .icon{grid-row:span 2}.wish h3{margin:0 0 4px}.section{padding:32px 0 38px}.lantern{top:72px;font-size:30px;opacity:.45}.actions{gap:8px}.button{padding:12px 17px;font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"><div class="cloud one"></div><div class="cloud two"></div></div>
  <header class="wrap nav"><a class="brand" href="#top">月下小笺</a><span>花好月圆 · 共此良宵</span></header>
  <div class="lantern left" aria-hidden="true">🏮</div><div class="lantern right" aria-hidden="true">🏮</div>
  <main id="top" class="wrap">
    <section class="hero"><div class="date">MID-AUTUMN FESTIVAL&nbsp; · &nbsp;中秋佳节</div><h1>月亮今晚很圆</h1><p class="subtitle">愿你抬头有月，低头有爱，身边有惦念。</p><div class="moon-wrap" role="img" aria-label="夜空中的一轮明月"><div class="orbit"></div><div class="moon"><i class="moon-crater"></i></div><div class="rabbit">🐇</div><span class="rabbit-label">月宫来信</span></div><div class="actions"><button class="button" id="blessBtn">收下一句祝福 ✨</button><a class="button ghost" href="#wishes">逛逛月下小笺 ↓</a></div></section>
    <section class="section" id="wishes"><div class="section-title">六颗小月亮，各有一份祝福</div><p class="section-desc">点亮家人的名字，收听专属的月球祝福电台 ✦</p><div class="family" role="group" aria-label="选择一位家人收取中秋祝福"><button class="family-btn" data-person="dad"><span class="emoji">🧭</span><span class="role">家里的定海神针</span><strong>爸爸 · 江忠明</strong></button><button class="family-btn" data-person="mom"><span class="emoji">🌷</span><span class="role">温柔能量总站</span><strong>妈妈 · 江中辉</strong></button><button class="family-btn" data-person="sister1"><span class="emoji">🌟</span><span class="role">大姐 · 星光领航员</span><strong>大姐 · 江杭颖</strong></button><button class="family-btn" data-person="sister2"><span class="emoji">🎨</span><span class="role">二姐 · 快乐调色师</span><strong>二姐 · 江蔚婷</strong></button><button class="family-btn" data-person="me"><span class="emoji">🚀</span><span class="role">三妹 · 月球站长</span><strong>三妹 / 我 · 江嘉玥</strong></button><button class="family-btn" data-person="brother"><span class="emoji">🛸</span><span class="role">四弟 · 银河小队员</span><strong>四弟 · 江京蔚</strong></button></div><div class="wishbox" id="wishbox" aria-live="polite">月球电台已调频，等你点名一位家人。<small>祝福正在穿越银河抵达中……</small></div></section>
    <footer class="bottom">月光所至，皆是故乡。&nbsp; · &nbsp;中秋快乐</footer>
  </main>
  <script>
    const sky=document.querySelector('#sky');for(let i=0;i<55;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*4)+'s';s.style.opacity=(.25+Math.random()*.65);sky.appendChild(s)}
    const greetings={dad:['爸爸江忠明，感谢你一直稳稳撑起我们的家。愿你的肩膀少些辛苦，心里多些轻松；月圆人安康，天天都有好心情！','江忠明同志，中秋特别任务：放下操心，领取全家人的拥抱和一盒月饼。祝你身体倍儿棒，笑声比月亮还亮！'],mom:['妈妈江中辉，你是我们家的温柔月光，照顾着每一个人。今晚也请把自己放在第一位：吃块喜欢的月饼，赏最圆的月，幸福常伴！','江中辉女士，月球电台播报：你的温柔已成功让全家幸福值满格。祝你每天都被爱包围，平安喜乐，笑口常开！'],sister1:['大姐江杭颖，愿你一路有星光，也有说走就走的底气。新的一岁灵感满满、好运连连，想做的事都闪闪发光！','江杭颖大姐，家族星际舰队向你发送最强祝福：工作顺心、生活有趣、快乐超标，永远做自己的主角！'],sister2:['二姐江蔚婷，愿你的日子像调色盘一样，想要的颜色都有：一点甜、一点惊喜，还有很多自由自在的快乐！','江蔚婷二姐，中秋快乐！愿好运像月饼馅料一样丰富，烦恼像月饼盒一样——打开之后发现里面是空的！'],me:['江嘉玥，今天你是全家的月球站长！愿你继续勇敢探索、开心创造，所有奇思妙想都能发射成功，快乐永远不迷航！','三妹江嘉玥，给自己签收一份宇宙级祝福：灵感爆棚、每天有趣、想吃的月饼都不长胖——这个愿望月亮正在努力！'],brother:['四弟江京蔚，愿你每天都有新发现，游戏关关通、功课顺顺利利，快乐能量满格，长高速度像火箭！','江京蔚小队员，中秋任务已发布：收下全家祝福、吃好吃的、开开心心。愿你勇敢又聪明，银河冒险一路畅通！']};document.querySelectorAll('.family-btn').forEach(button=>button.addEventListener('click',()=>{const choices=greetings[button.dataset.person];const message=choices[Math.floor(Math.random()*choices.length)];const box=document.querySelector('#wishbox');box.innerHTML=message+'<small>✦ 月球电台 · 专属祝福已送达 ✦</small>';box.classList.add('active')}));
  </script>
</body>
</html>
